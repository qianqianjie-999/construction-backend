{% extends "admin/base.html" %}

{% block content %}
<div class="page-header animate-in">
    <h1 class="page-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        创建新项目
    </h1>
</div>

<div class="card form-card animate-in">
    <div class="card-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px; margin-right: 8px; color: var(--primary);">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        项目信息
    </div>
    <div class="card-body">
        {% if error %}
        <div class="alert alert-error">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            {{ success }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label class="form-label required" for="name">项目名称</label>
                <input type="text" id="name" name="name" class="form-input" placeholder="请输入项目名称" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="location">工程地点</label>
                <input type="text" id="location" name="location" class="form-input" placeholder="请输入工程地点">
            </div>

            <div class="form-group">
                <label class="form-label" for="company">建设单位</label>
                <input type="text" id="company" name="company" class="form-input" placeholder="请输入建设单位名称">
            </div>

            <div class="form-group">
                <label class="form-label" for="manager">项目经理</label>
                <input type="text" id="manager" name="manager" class="form-input" placeholder="请输入项目经理姓名">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    创建项目
                </button>
                <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-secondary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    返回列表
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
