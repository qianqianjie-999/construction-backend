# ============================================================
# frpc.toml — 内网 frp Client（rust_frp / frp 新版 TOML 格式）
# 部署位置示例：内网服务器 /opt/rust_frp/conf/frpc.toml
# 必须与云服务器 frps.toml 完全对齐: server_port / auth / TLS
# 完整链路: 内网 gunicorn:8082 → frpc → frps(云) → 云 Nginx(SSL)
# ============================================================

# 云服务器公网 IP（部署时替换为你自己的）
server_addr = "YOUR_CLOUD_SERVER_IP"
server_port = 9300

# 鉴权（token 必须和 frps 一致）
# 生成方法：openssl rand -hex 32
[auth]
method = "token"
token = "REPLACE_WITH_RANDOM_TOKEN_openssl_rand_hex_32"

# 传输协议
[transport]
protocol = "tcp"

# TLS 加密（必须开，frps 已 enable = true）
[transport.tls]
enable = true

# 日志
log_file = "/var/log/frpc.log"
log_level = "info"
log_max_days = 7

# ---------- 施工日志系统 ----------
# 内网 gunicorn (gevent) 监听 8082 → frpc 映射到云服务器 19304
# （19304 为 frp 内部端口，云 Nginx 监听 9304 SSL 反代到 127.0.0.1:19304）

[[proxies]]
name = "web_app"
type = "tcp"
local_ip = "127.0.0.1"
local_port = 8082
remote_port = 19304
