# ============================================================
# Nginx 反代配置示例 —— 云服务器（公网入口 + SSL 卸载）
# 将本 server 块放入 /etc/nginx/nginx.conf 的 http {} 内
# （证书路径按你的实际环境配置，或用 certbot 自动签发）
# 完整链路:
#   App/浏览器 → https://云IP:9304 (Nginx SSL)
#             → 127.0.0.1:19304 (frps)
#             → frpc 隧道 → 内网 gunicorn:8082
# ============================================================

    server {
        listen 9304 ssl;
        client_max_body_size 25m;   # 照片/文件上传大小限制

        # ssl_certificate     /path/to/fullchain.pem;
        # ssl_certificate_key /path/to/privkey.pem;

        location / {
            proxy_pass http://127.0.0.1:19304;   # frps 映射端口
            proxy_http_version 1.1;

            # 标准反代头
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ---------- Socket.IO 关键头（实时聊天需要 WebSocket）----------
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # ---------- 超时（Socket.IO 长连接）----------
            proxy_connect_timeout  60s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;

            # 关闭缓冲，实时消息立即转发
            proxy_buffering off;
        }
    }
