# ============================================================
# Nginx 反代配置 —— 阿里云 123.57.86.80
# 直接粘贴到 /etc/nginx/nginx.conf 的 http {} 内
# SSL 证书已在 http{} 顶部全局配置好
# 完整链路: listen 9304 ssl → proxy_pass 127.0.0.1:9304 → frps → frpc → 内网 Flask:8082
# ============================================================

    # 9304（施工日志系统 —— 含 Socket.IO 聊天，需 WebSocket 头）
    server {
        listen 9304 ssl;
        client_max_body_size 25m;

        location / {
            proxy_pass http://127.0.0.1:9304;
            proxy_http_version 1.1;

            # 标准反代头
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ---------- Socket.IO 关键头（聊天用）----------
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # ---------- 超时（Socket.IO 长连接）----------
            proxy_connect_timeout  60s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;

            # 关闭缓冲，实时消息立即转发
            proxy_buffering off;
        }
    }
